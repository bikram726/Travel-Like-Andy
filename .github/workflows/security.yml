name: App security and regression checks
on:
  pull_request:
    paths: ['app/**', 'docs/security-evidence/scan-source.cjs', '.github/**']
  push:
    branches: [main, master]
    paths: ['app/**', 'docs/security-evidence/scan-source.cjs', '.github/**']
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run security:check && npm run lint && npm run typecheck && npm test && npm run build:web && npm run brand:check
        working-directory: app
      - run: node docs/security-evidence/scan-source.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: andygo-web-dist
          path: app/dist-web
          if-no-files-found: error
          retention-days: 14
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: app/.node-version
      # Intentionally reports/fails on remaining upstream advisories; no suppression.
      - run: npm audit --audit-level=moderate
        working-directory: app
