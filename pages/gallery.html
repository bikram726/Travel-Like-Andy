<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap');
.tla-gallerypage-wrap { width:100vw; position:relative; left:calc(-50vw + 50%); overflow:hidden; }
.tla-gallerypage { --bg:#0a0a0a; --surface:#0d0d0a; --gold:#c8af78; --text:#f0ebe0; --muted:#7a7060; background:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; font-weight:300; width:100%; }
.tla-gallerypage * { box-sizing:border-box; }
.tla-gallerypage h1 { font-family:'Cormorant Garamond',serif; font-weight:300; color:var(--text); margin:0; }
.tla-gallerypage .tlga-hero { padding:6rem 1.5rem 3rem; text-align:center; }
.tla-gallerypage .tlga-hero h1 { font-size:clamp(2rem,5.5vw,3.6rem); line-height:1.15; font-style:italic; }
.tla-gallerypage .tlga-hero p { color:var(--muted); font-size:0.8rem; letter-spacing:0.2em; text-transform:uppercase; margin-top:1.3rem; }
.tla-gallerypage .tlga-embed { max-width:1000px; margin:0 auto; padding:0 1.5rem 6rem; }
.tla-gallerypage .tlga-embed-frame { position:relative; width:100%; padding-top:60%; background:var(--surface); border:1px solid rgba(200,175,120,0.18); }
.tla-gallerypage .tlga-embed-frame iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
@media (max-width:767px) {
  .tla-gallerypage .tlga-hero { padding:4.5rem 1.2rem 2rem; }
  .tla-gallerypage .tlga-embed-frame { padding-top:100%; }
}
</style>
<div class="tla-gallerypage-wrap"><div class="tla-gallerypage">
  <section class="tlga-hero">
    <h1>Gallery</h1>
    <p>More to come</p>
  </section>
  <section class="tlga-embed">
    <div class="tlga-embed-frame">
      <!-- Paste the Google Slides embed code here once Andy sends the presentations (Google Slides: File, Share, Publish to web, Embed). This box is already sized and bordered to fit it automatically. -->
    </div>
  </section>
</div></div>
