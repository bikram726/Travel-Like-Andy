/* SCROLL FIX (added 2026-08-24, verified live before shipping): the lock
   screen could not scroll at all on shorter viewports, leaving the
   password field clipped off-screen and unreachable (confirmed
   unreachable at 375x667). Root cause: Squarespace's own
   .sqs-slide-layer.layer-front is position:absolute with a pinned
   height, so it never contributes to the document's real scrollHeight.
   Switching it to position:relative lets real content height drive
   scrolling again. Trade-off measured: this also makes .layer-back's
   fixed background photo stop at one viewport height, since it was
   sized to the old pinned-height container -- fixed by pinning
   .layer-back to the viewport directly instead, plus a navy html/body
   fallback so nothing flashes white during scroll/iOS overscroll. */
.sqs-slide-wrapper[data-slide-type="lock-screen"] .sqs-slide-layer.layer-front {
  position: relative !important;
  top: auto !important;
  height: auto !important;
  min-height: 100vh !important;
  overflow-y: visible !important;
}
.sqs-slide-wrapper[data-slide-type="lock-screen"] .sqs-slide-layer.layer-back {
  position: fixed !important;
  inset: 0 !important;
  height: auto !important;
}
html, body { background: #12355B !important; }

/* 1 - NAV CLEARANCE
   The nav is position:fixed, so it reserves no space of its own. Its
   height isn't constant: six links sit on one row on desktop and wrap to
   two rows at <=600px, which is why the old hard-coded 5rem clearance let
   the second row sit on top of the heading. Declare the nav's geometry
   once as custom properties and CALCULATE the clearance from it, so the
   two can never drift apart again. --tlab-nav-rows must match how many
   rows the links actually wrap onto -- six links = 2 rows at <=600px;
   adding a 7th link means re-checking. */
.sqs-slide-wrapper[data-slide-type="lock-screen"] {
  --tlab-nav-pad:   1.1rem;   /* nav vertical padding      */
  --tlab-nav-row:   1.35rem;  /* height of one link row    */
  --tlab-nav-rows:  1;        /* rows the links wrap onto  */
  --tlab-nav-gap:   0.5rem;   /* vertical gap between rows */
  --tlab-nav-clear: 1.75rem;  /* breathing room below bar  */
}
@media (max-width: 600px) {
  .sqs-slide-wrapper[data-slide-type="lock-screen"] {
    --tlab-nav-pad:  0.85rem;
    --tlab-nav-rows: 2;
  }
}
/* stop iOS from inflating text and undoing the tuned spacing */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

.tlab-lock-nav.tlab-lock-nav {
  padding-top:    var(--tlab-nav-pad);
  padding-bottom: var(--tlab-nav-pad);
  row-gap:        var(--tlab-nav-gap);
  align-items:    center;
}
.tlab-lock-nav.tlab-lock-nav a { line-height: var(--tlab-nav-row); }

.sqs-slide-wrapper[data-slide-type="lock-screen"] .sqs-slide-container .sqs-slide {
  padding-top: calc(
      var(--tlab-nav-pad) * 2
    + var(--tlab-nav-row) * var(--tlab-nav-rows)
    + var(--tlab-nav-gap) * (var(--tlab-nav-rows) - 1)
    + var(--tlab-nav-clear)
  ) !important;
}

/* HIDE THE NATIVE BRANDING HEADING -- the lock screen's native "Branding"
   text field reads "Andrew Eisenmann" (the legal name, not the brand's
   voice), a leftover default that was only invisible by accident -- it
   sits at the very top of the page, underneath the fixed .tlab-lock-nav
   bar, so it happened to be covered rather than deliberately hidden.
   Hiding it explicitly rather than relying on z-index stacking, same
   pattern as the retired-footer-logo re-hide rule in

   page's other heading slice is a separate .sqs-slice and both happen to
   render as h1#sqs-slash-page-header (a duplicate id) -- the
   compound-type attribute is what actually tells them apart. */
.sqs-slide-wrapper[data-slide-type="lock-screen"] .sqs-slice[data-compound-type="logo"] {
  display:none !important;
}

/* 2 - DROP THE BIG NATIVE HEADLINE
   The Squarespace HEADLINE field ("travellikeandy BESPOKE") rendered at a
   flat 64px at every width -- on phones its first line measured 384px
   inside a 265-320px box, so the ends were clipped. The wordmark now
   lives further down as a small gold lockup (see 3), so the headline
   slice is hidden here. Leave the admin field alone; hiding it in CSS
   keeps the copy recoverable. */
.sqs-slide-wrapper[data-slide-type="lock-screen"] .sqs-slice[data-slice-type="heading"] {
  display: none !important;
}

/* 3 - BODY PARAGRAPH + SMALL GOLD WORDMARK
   The welcome paragraph is its own slice. The wordmark is a single
   pseudo-element on that same slice so it lands between the paragraph
   and "In Partnership With" without touching the markup, and can't
   collide with a sibling since its margin is positive. */

  padding-top: 0.25rem !important;
}
