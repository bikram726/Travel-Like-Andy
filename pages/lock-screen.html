/* SCROLL FIX (added 2026-08-24, verified live before shipping): the lock
   screen could not scroll at all on shorter viewports, leaving the
   password field clipped off-screen and unreachable (confirmed
   unreachable at 375x667). Root cause: Squarespace's own
   .sqs-slide-layer.layer-front is position:absolute with a pinned
   height, so it never contributes to the document's real scrollHeight.
   Switching it to position:relative lets real content height drive
   scrolling again -- this also means the existing padding-top:5rem on
   .sqs-slide above (previously a no-op, since .layer-front ignored it)
   now actually takes effect, so no extra padding is added here.
   Trade-off measured: this also makes .layer-back's fixed background
   photo stop at one viewport height, since it was sized to the old
   pinned-height container -- fixed by pinning .layer-back to the
   viewport directly instead, plus a navy html/body fallback so nothing
   flashes white during scroll/iOS overscroll. First candidate (this
   comment's rule alone, no .layer-back/html/body rules) was tested and
   rejected: it fixed scrolling but left the page white below the first
   viewport. A separate overflow-y:auto-on-the-absolute-layer approach
   was also tested and rejected -- it never actually enabled scrolling
   at all (visible overflow on a fixed-height flex/box ancestor doesn't
   grow a scroll container), so this position:relative approach is the
   one that's real. */
.sqs-slide-wrapper[data-slide-type="lock-screen"] .sqs-slide-layer.layer-front {
  position: relative !important;
  top: auto !important;
  height: auto !important;
  min-height: 100vh !important;
  overflow-y: visible !important;
}
.sqs-slide-wrapper[data-slide-type="lock-screen"] .sqs-slide-layer.layer-back {
  position: fixed !important;
  inset: 0 !important;
  height: auto !important;
}
html, body { background: #12355B !important; }

/* HIDE THE NATIVE BRANDING HEADING (added 2026-08-24) -- the lock screen's
   native "Branding" text field reads "Andrew Eisenmann" (the legal name,

   was only invisible by accident -- it sits at the very top of the page,
   underneath the fixed .tlab-lock-nav bar, so it happened to be covered
   rather than deliberately hidden. Hiding it explicitly rather than relying
   on z-index stacking, same pattern as the retired-footer-logo re-hide rule

}

/* Partner-logo strip below the password field.

   2026-08-24: rebuilt as a continuous auto-scrolling marquee, and
   logos sized up (24px -> 34px -> 44px desktop, 19px -> 28px -> 36px
   mobile, across two passes). This is a deliberate, scoped exception
   to this site's general "no carousels/
   sliders/rotators" motion policy (see MEDIA_MOTION_ADDENDUM.md /
   HANDOFF_NOTES.md) -- explicitly requested by the client for this one
   partner-logo strip specifically, not a reversal of that policy
   elsewhere on the site. The logo list is duplicated once (the second
   copy wrapped in `.tlab-lock-partners-dup[aria-hidden="true"]`, styled
   `display:contents` so it stays invisible to assistive tech without
   adding an extra flex wrapper) so the loop can seamlessly repeat via a
   50% translateX. Pauses on hover, and freezes to a plain static
   (non-scrolling, horizontally scrollable-by-hand, duplicate hidden
   outright) row under prefers-reduced-motion rather than looping
   forever regardless of that preference. */
.tlab-lock-partners-eyebrow {
  text-align:center;
  color:rgba(244,239,230,0.7);
  font-family:'Source Sans 3',sans-serif;
  font-weight:600;

  letter-spacing:0.22em;
  text-transform:uppercase;
  margin:2.8rem 0 1.2rem;
}
.tlab-lock-partners {
  max-width:960px;
  margin:0 auto;
  padding-top:1.8rem;
  border-top:1px solid rgba(201,169,110,0.2);
  overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.tlab-lock-partners-track {
  display:flex;
  align-items:center;
  gap:0.9rem;
  width:max-content;
  animation:tlab-lock-marquee 36s linear infinite;
}
.tlab-lock-partners:hover .tlab-lock-partners-track {
  animation-play-state:paused;
}
.tlab-lock-partners-dup {
  display:contents;
}
@keyframes tlab-lock-marquee {
  from { transform:translateX(0); }
  to { transform:translateX(-50%); }
}
.tlab-lock-partner {
  background:#F4EFE6;
  border-radius:8px;

  box-shadow:inset 0 0 0 1px rgba(201,169,110,0.3);
  transition:transform 0.32s cubic-bezier(.22,.61,.36,1), box-shadow 0.32s cubic-bezier(.22,.61,.36,1);
}
.tlab-lock-partner:hover {
  transform:translateY(-2px);
  box-shadow:inset 0 0 0 1px rgba(201,169,110,0.7), 0 6px 16px rgba(0,0,0,0.25);
}
.tlab-lock-partner img {
  height:44px;

  object-fit:contain;
  display:block;

  .tlab-lock-partner img { height:36px; max-width:132px; }

}
@media (prefers-reduced-motion: reduce) {
  .tlab-lock-partner { transition:none; }
  .tlab-lock-partners-track { animation:none; width:auto; flex-wrap:wrap; justify-content:center; }
  .tlab-lock-partners { overflow-x:auto; -webkit-mask-image:none; mask-image:none; }
  /* the duplicate set exists only to feed the marquee loop -- with the
     loop off, showing it too would visually repeat every logo, not just
     hide it from assistive tech, so hide it outright here */
  .tlab-lock-partners-dup { display:none; }
}
