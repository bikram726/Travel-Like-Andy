<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap');
.tla-journal-wrap { width:100vw; position:relative; left:calc(-50vw + 50%); overflow:hidden; }
.tla-journal {
  --midnight:#12355B; --gold:#C9A96E; --white:#FFFFFF;
  --muted-on-dark:rgba(244,239,230,0.75);
  background:var(--midnight); color:var(--white);
  font-family:'Source Sans 3',sans-serif; font-weight:300; width:100%;
}
.tla-journal * { box-sizing:border-box; }
.tla-journal h1 { font-family:'Cormorant Garamond',serif; font-weight:600; color:var(--white); margin:0; font-size:clamp(3rem,7vw,6.5rem); line-height:0.95; letter-spacing:-0.02em; }
.tla-journal em { font-style:normal; color:var(--gold); }
.tla-journal .tljo-hero { min-height:70vh; display:flex; align-items:center; justify-content:center; padding:6rem 1.5rem; text-align:center; }
.tla-journal .tljo-hero-inner { max-width:780px; }
.tla-journal .tljo-lockup { display:flex; flex-direction:column; align-items:center; gap:0.35rem; margin-bottom:2rem; }
.tla-journal .tljo-lockup-word { font-family:'Cormorant Garamond',serif; font-weight:400; font-size:1.6rem; color:var(--white); }
.tla-journal .tljo-lockup-division { font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:0.72rem; letter-spacing:0.26em; text-transform:uppercase; color:var(--gold); }
.tla-journal .tljo-eyebrow { font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); margin:0 0 1.4rem; }
.tla-journal .tljo-deck { color:var(--muted-on-dark); font-size:1.08rem; line-height:1.65; max-width:560px; margin:1.6rem auto 2.4rem; }
.tla-journal .tljo-btn { display:inline-block; font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:0.82rem; letter-spacing:0.12em; text-transform:uppercase; text-decoration:none; padding:1em 2.4em; border-radius:8px; background:#F26A21; color:var(--white); border:1px solid #F26A21; transition:background 0.3s ease-out, border-color 0.3s ease-out; }
.tla-journal .tljo-btn:hover { background:#d85a15; border-color:#d85a15; }
.tla-journal .tla-cue-mark { display:flex; align-items:center; justify-content:center; margin:2.4rem 0 0.4rem; }
.tla-journal .tla-cue-mark-svg { width:150px; height:34px; overflow:visible; color:var(--gold); }
.tla-journal .tla-cue-mark-line { fill:none; stroke:currentColor; stroke-width:1.2; stroke-linecap:round; stroke-dasharray:140; stroke-dashoffset:140; transition:stroke-dashoffset 0.6s cubic-bezier(.22,.61,.36,1); }
.tla-journal .tla-cue-mark-star { fill:currentColor; opacity:0; transition:opacity 0.3s ease-out; }
.tla-journal .tla-cue-mark-star.s1 { transition-delay:0.55s; }
.tla-journal .tla-cue-mark-star.s2 { transition-delay:0.68s; }
.tla-journal .tla-cue-mark-star.s3 { transition-delay:0.81s; }
.tla-journal .tla-cue-mark.tla-cue-play .tla-cue-mark-line { stroke-dashoffset:0; }
.tla-journal .tla-cue-mark.tla-cue-play .tla-cue-mark-star { opacity:1; }
@media (prefers-reduced-motion: reduce) {
  .tla-journal .tla-cue-mark-line { stroke-dashoffset:0 !important; transition:none !important; }
  .tla-journal .tla-cue-mark-star { opacity:1 !important; transition:none !important; }
}
</style>
<div class="tla-journal-wrap"><div class="tla-journal">
  <section class="tljo-hero"><div class="tljo-hero-inner">
    <div class="tljo-lockup">
      <span class="tljo-lockup-word">travellikeandy</span>
      <span class="tljo-lockup-division">Journal</span>
    </div>
    <p class="tljo-eyebrow">Destination Intelligence</p>
    <h1>Perspective, <em>not a packing list.</em></h1>
    <p class="tljo-deck">Notes from places Andy has actually stood &mdash; practical, cultural, and occasionally opinionated. The first stories are being written; check back soon.</p>
    <div class="tla-cue-mark" aria-hidden="true">
      <svg class="tla-cue-mark-svg" viewBox="0 0 150 34" focusable="false">
        <path class="tla-cue-mark-line" d="M2 26 L108 10"/>
        <path class="tla-cue-mark-star s1" d="M124 6 C125 10 125 10 129 11 C125 12 125 12 124 16 C123 12 123 12 119 11 C123 10 123 10 124 6 Z"/>
        <path class="tla-cue-mark-star s2" d="M136 14 C136.7 16.5 136.7 16.5 139 17.2 C136.7 17.9 136.7 17.9 136 20.4 C135.3 17.9 135.3 17.9 133 17.2 C135.3 16.5 135.3 16.5 136 14 Z"/>
        <path class="tla-cue-mark-star s3" d="M118 18 C118.6 20 118.6 20 120.6 20.6 C118.6 21.2 118.6 21.2 118 23.2 C117.4 21.2 117.4 21.2 115.4 20.6 C117.4 20 117.4 20 118 18 Z"/>
      </svg>
    </div>
    <a href="/contact" class="tljo-btn" style="margin-top:1.6rem;">Begin a Journey</a>
  </div></section>
</div></div>
<script>
(function(){
  var cues = document.querySelectorAll('.tla-cue-mark');
  if (!cues.length) { return; }
  if (!('IntersectionObserver' in window) || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    cues.forEach(function(c){ c.classList.add('tla-cue-play'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) { entry.target.classList.add('tla-cue-play'); io.unobserve(entry.target); }
    });
  }, { threshold: 0.4 });
  cues.forEach(function(c){ io.observe(c); });
})();
</script>
