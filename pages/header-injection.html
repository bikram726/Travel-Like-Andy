<style>
/* BESPOKE LUXURY LOCK SCREEN — paste into Settings -> Advanced -> Code Injection -> HEADER */
/* LEGACY, pre-dates pages/lock-screen.html. Uses generic Squarespace password-page
   selectors (.sqs-password-page, .password-page, body.password-protected) instead
   of the more specific .sqs-slide-wrapper[data-slide-type="lock-screen"] .sqs-slide
   selector pages/lock-screen.html uses. Very likely superseded by that file (which
   is confirmed live and rendering correctly as of 2026-07-23/24), but left in place
   here rather than removed -- its selectors' current match/no-match status against
   Squarespace's actual DOM hasn't been verified live, so deleting it is a decision
   for a dedicated pass, not a side effect of fixing the Home hero bug below. */
.sqs-password-page-wrapper,
.password-page,
body.password-protected,
.sqs-password-page {
  background: linear-gradient(180deg, rgba(5,5,5,0.82), rgba(10,10,10,0.92)),
    url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat !important;
  min-height: 100vh !important;
}
.sqs-password-page input[type="password"],
.password-page input[type="password"] {
  background: rgba(0,0,0,0.3) !important;
  border: none !important;
  border-bottom: 1px solid rgba(200,175,120,0.6) !important;
  color: #f0ebe0 !important;
  font-family: 'Montserrat', sans-serif !important;
}
.sqs-password-page input[type="submit"],
.password-page .sqs-system-button,
.password-page button {
  background: #c8af78 !important;
  color: #0a0a0a !important;
  border: none !important;
}
#tla-lock-msg {
  max-width: 640px;
  margin: 0 auto 2rem;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.3rem;
  line-height: 1.75;
  color: #dfc898;
  padding: 0 1.5rem;
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var page = document.querySelector('.sqs-password-page, .password-page, .sqs-password-page-wrapper');
  if (page && !document.getElementById('tla-lock-msg')) {
    var msg = document.createElement('div');
    msg.id = 'tla-lock-msg';
    msg.innerHTML = "This is where your next extraordinary journey begins. Andy&rsquo;s bespoke travel division is a private, invitation-only circle &mdash; every escape personally designed, every detail quietly handled.<br><br>Enter your password below to step inside.";
    var form = page.querySelector('form');
    if (form) { form.parentNode.insertBefore(msg, form); }
    else { page.insertBefore(msg, page.firstChild); }
  }
});
</script>
